name: CI & Auto Build (Docker + Windows App)

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional Git tag (e.g. v2.6.0) to build binaries, multi-arch Docker image, and publish GitHub Release"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================================
  # 1. 前端构建检查 + Go 分层加密与 SSH/SFTP 安全集成测试
  # ============================================================================
  test:
    name: Security & Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || '' }}

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install & Build Frontend Bundle
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run test:unit
          npm run build

      - name: Release Automation Script Unit Tests
        run: node --test .github/scripts/release-bot.test.mjs

      - name: Static Vet & Race-Enabled Security Integration Suite
        run: |
          go vet ./...
          go test ./... -v -race -count=1

  # ============================================================================
  # 2. 自动构建纯本地 Windows 桌面应用 (.exe + 便携压缩包) 与 Linux 独立二进制
  # ============================================================================
  build-windows-app:
    name: Build Windows Local App & Server Binaries
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || '' }}

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Windows GUI EXEs & Linux Server Binaries
        env:
          SNS_VERSION: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev') }}
        run: |
          export SNS_COMMIT="$(git rev-parse HEAD)"
          bash ./scripts/build-all.sh

      - name: Verify Windows Native GUI Subsystem Header
        run: |
          OUT_X64=$(file dist/ServerNeedSafe-windows-amd64.exe)
          echo "$OUT_X64"
          echo "$OUT_X64" | grep -q "PE32+ executable"
          echo "$OUT_X64" | grep -q "(GUI)"

          OUT_ARM64=$(file dist/ServerNeedSafe-windows-arm64.exe)
          echo "$OUT_ARM64"
          echo "$OUT_ARM64" | grep -q "PE32+ executable"
          echo "$OUT_ARM64" | grep -q "(GUI)"

      - name: Package Portable Windows Bundles
        run: |
          mkdir -p pkg/win-x64 pkg/win-arm64
          cp dist/ServerNeedSafe-windows-amd64.exe pkg/win-x64/ServerNeedSafe.exe
          cp README.md pkg/win-x64/README.md
          (cd pkg/win-x64 && zip -9 -r ../../dist/ServerNeedSafe-Windows-x64-Portable.zip .)

          cp dist/ServerNeedSafe-windows-arm64.exe pkg/win-arm64/ServerNeedSafe.exe
          cp README.md pkg/win-arm64/README.md
          (cd pkg/win-arm64 && zip -9 -r ../../dist/ServerNeedSafe-Windows-arm64-Portable.zip .)

          (
            cd dist
            sha256sum \
              ServerNeedSafe-windows-amd64.exe \
              ServerNeedSafe-windows-arm64.exe \
              ServerNeedSafe-Windows-x64-Portable.zip \
              ServerNeedSafe-Windows-arm64-Portable.zip \
              sns-server-linux-amd64 \
              sns-server-linux-arm64 > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Upload Windows Local Desktop Application Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ServerNeedSafe-Windows-App
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/ServerNeedSafe-windows-amd64.exe
            dist/ServerNeedSafe-windows-arm64.exe
            dist/ServerNeedSafe-Windows-x64-Portable.zip
            dist/ServerNeedSafe-Windows-arm64-Portable.zip
            dist/SHA256SUMS.txt

      - name: Upload Linux Standalone Server Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ServerNeedSafe-Linux-Server
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/sns-server-linux-amd64
            dist/sns-server-linux-arm64
            dist/SHA256SUMS.txt

  # ============================================================================
  # 3. 自动构建多架构 Docker 镜像、运行容器健康探针并推送至 GHCR
  # ============================================================================
  build-docker:
    name: Build & Publish Multi-Arch Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.ghcr }}
      digest: ${{ steps.build_push.outputs.digest }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || '' }}

      - name: Normalize Image Reference & Build Metadata
        id: img
        run: |
          IMAGE_GHCR=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BUILD_COMMIT=$(git rev-parse HEAD)
          echo "ghcr=${IMAGE_GHCR}" >> "$GITHUB_OUTPUT"
          echo "commit=${BUILD_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU Multi-Arch Support
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local amd64 Image for Container Smoke Test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: serverneedsafe:ci-smoke
          build-args: |
            SNS_VERSION=${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev') }}
            SNS_COMMIT=${{ steps.img.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Live Container Health & Web UI Smoke Check
        run: |
          docker run -d --name sns-smoke -p 18080:8080 serverneedsafe:ci-smoke
          trap "docker logs sns-smoke || true; docker rm -f sns-smoke >/dev/null 2>&1 || true" EXIT
          READY=0
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:18080/api/health 2>/dev/null | grep -q '"ok":true'; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Container failed healthcheck within 25s"
            exit 1
          fi
          curl -fsS http://127.0.0.1:18080/api/health | grep -q '"daemon_mode":true'
          curl -fsS http://127.0.0.1:18080/api/auth/status | grep -q '"deploy_mode":"server"'
          curl -fsS http://127.0.0.1:18080/ | grep -q '<div id="root">'

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.ghcr }}
          tags: |
            type=raw,value=latest,enable=${{ (inputs.release_tag == '' && github.ref == 'refs/heads/main') || (inputs.release_tag != '' && !contains(inputs.release_tag, '-')) }}
            type=ref,event=branch,enable=${{ inputs.release_tag == '' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') && inputs.release_tag == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && inputs.release_tag == '' }}
            type=semver,pattern={{version}},value=${{ inputs.release_tag || 'v0.0.0' }},enable=${{ inputs.release_tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag || 'v0.0.0' }},enable=${{ inputs.release_tag != '' }}
            type=sha,prefix=sha-

      - name: Build & Push Multi-Platform Image (linux/amd64, linux/arm64)
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SNS_VERSION=${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev') }}
            SNS_COMMIT=${{ steps.img.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 4. 自动通过 SSH 部署容器至目标生产服务器（严格仅绑定 127.0.0.1:18899 供 Nginx 反代）
  # ============================================================================
  deploy:
    name: Auto Deploy to Production Server (127.0.0.1:18899)
    needs: [build-docker]
    if: >-
      github.event_name != 'pull_request' &&
      !startsWith(github.ref, 'refs/tags/') &&
      inputs.release_tag == ''
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check Deployment Secrets
        id: check_secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_HOST or DEPLOY_SSH_KEY not configured; skipping auto-deploy."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH Key & Probe Server Environment
        id: probe
        if: steps.check_secrets.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          awk '{sub(/\r$/, ""); print}' <<< "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH_OPTS=(
            -i ~/.ssh/deploy_key
            -p "${DEPLOY_PORT:-22}"
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )

          REMOTE_ARCH=$(ssh "${SSH_OPTS[@]}" "${DEPLOY_USER:-root}@${DEPLOY_HOST}" '
            set -euo pipefail
            ARCH=$(uname -m)
            if ! command -v docker >/dev/null 2>&1; then
              echo "[deploy] Docker not found on target host, installing..." >&2
              if command -v apt-get >/dev/null 2>&1; then
                DEBIAN_FRONTEND=noninteractive apt-get update -y >&2
                DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-compose-v2 >&2 || \
                  DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io >&2
              elif command -v dnf >/dev/null 2>&1; then
                dnf install -y docker >&2 || curl -fsSL https://get.docker.com | sh >&2
              elif command -v yum >/dev/null 2>&1; then
                yum install -y docker >&2 || curl -fsSL https://get.docker.com | sh >&2
              else
                curl -fsSL https://get.docker.com | sh >&2
              fi
            fi
            if command -v systemctl >/dev/null 2>&1; then
              systemctl enable --now docker >&2 || true
            fi
            docker info >/dev/null
            echo "$ARCH"
          ')

          REMOTE_ARCH=$(printf '%s\n' "$REMOTE_ARCH" | tail -n 1 | tr -d '[:space:]')
          case "$REMOTE_ARCH" in
            x86_64|amd64) PLATFORM="linux/amd64" ;;
            aarch64|arm64) PLATFORM="linux/arm64" ;;
            *)
              echo "Unsupported remote architecture: $REMOTE_ARCH" >&2
              exit 1
              ;;
          esac
          echo "platform=${PLATFORM}" >> "$GITHUB_OUTPUT"
          echo "Remote server ready (arch=${REMOTE_ARCH} -> ${PLATFORM})"

      - name: Log in to GHCR on Runner
        if: steps.check_secrets.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stream Verified Image & Deploy Strictly on 127.0.0.1:18899
        if: steps.check_secrets.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          IMAGE="${{ needs.build-docker.outputs.image }}"
          DIGEST="${{ needs.build-docker.outputs.digest }}"
          PLATFORM="${{ steps.probe.outputs.platform }}"
          DEPLOY_DIR="/opt/serverneedsafe"
          LISTEN_ADDR="127.0.0.1:18899"

          docker pull --platform "${PLATFORM}" "${IMAGE}@${DIGEST}"
          docker tag "${IMAGE}@${DIGEST}" "${IMAGE}:latest"

          SSH_OPTS=(
            -i ~/.ssh/deploy_key
            -p "${DEPLOY_PORT:-22}"
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )

          echo "Streaming ${IMAGE}@${DIGEST} (${PLATFORM}) over encrypted SSH..."
          docker save "${IMAGE}:latest" | gzip -1 | ssh "${SSH_OPTS[@]}" "${DEPLOY_USER:-root}@${DEPLOY_HOST}" 'gunzip | docker load'

          ssh "${SSH_OPTS[@]}" "${DEPLOY_USER:-root}@${DEPLOY_HOST}" \
            "DEPLOY_DIR='${DEPLOY_DIR}' IMAGE='${IMAGE}:latest' LISTEN_ADDR='${LISTEN_ADDR}' bash -s" <<'EOF'
          set -euo pipefail

          mkdir -p "${DEPLOY_DIR}/data"
          chown -R 10001:10001 "${DEPLOY_DIR}/data"
          chmod 700 "${DEPLOY_DIR}/data"

          cat > "${DEPLOY_DIR}/docker-compose.yml" <<YAML
          services:
            serverneedsafe:
              image: ${IMAGE}
              container_name: serverneedsafe
              restart: unless-stopped
              ports:
                - "${LISTEN_ADDR}:8080"
              environment:
                - TZ=Asia/Shanghai
                - SNS_ADDR=0.0.0.0:8080
                - SNS_DATA_DIR=/data
                - SNS_SESSION_TTL=168h
              volumes:
                - ${DEPLOY_DIR}/data:/data
              security_opt:
                - no-new-privileges:true
          YAML

          docker rm -f serverneedsafe >/dev/null 2>&1 || true
          if docker compose version >/dev/null 2>&1; then
            (cd "${DEPLOY_DIR}" && docker compose up -d --remove-orphans)
          else
            docker run -d \
              --name serverneedsafe \
              --restart unless-stopped \
              -p "${LISTEN_ADDR}:8080" \
              -e TZ=Asia/Shanghai \
              -e SNS_ADDR=0.0.0.0:8080 \
              -e SNS_DATA_DIR=/data \
              -e SNS_SESSION_TTL=168h \
              -v "${DEPLOY_DIR}/data:/data" \
              --security-opt no-new-privileges:true \
              "${IMAGE}"
          fi

          fetch_local() {
            if command -v curl >/dev/null 2>&1; then
              curl --noproxy '*' -fsS "$1"
            else
              wget --no-proxy -qO- "$1"
            fi
          }

          READY=0
          for i in $(seq 1 30); do
            if fetch_local "http://${LISTEN_ADDR}/api/health" 2>/dev/null | grep -q '"ok":true'; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "[ERROR] ServerNeedSafe container failed healthcheck on ${LISTEN_ADDR}" >&2
            docker logs serverneedsafe || true
            exit 1
          fi

          fetch_local "http://${LISTEN_ADDR}/api/health" | grep -q '"daemon_mode":true'
          fetch_local "http://${LISTEN_ADDR}/api/auth/status" | grep -q '"deploy_mode":"server"'
          fetch_local "http://${LISTEN_ADDR}/" | grep -q '<div id="root">'
          docker exec serverneedsafe test -w /data

          PORT_BINDING=$(docker port serverneedsafe 8080/tcp)
          echo "Verified Docker port binding: ${PORT_BINDING}"
          if [ "${PORT_BINDING}" != "${LISTEN_ADDR}" ]; then
            echo "[SECURITY ERROR] Unexpected port binding '${PORT_BINDING}', expected strictly '${LISTEN_ADDR}'!" >&2
            docker rm -f serverneedsafe || true
            exit 1
          fi

          docker image prune -f >/dev/null 2>&1 || true
          echo "[OK] ServerNeedSafe is running and strictly bound to http://${LISTEN_ADDR}"
          EOF

  # ============================================================================
  # 5. 推送 v* 版本标签或自动发布调度时，上传 Windows/Linux 安装包并正式公开 GitHub Release
  # ============================================================================
  publish-release:
    name: Publish GitHub Release Assets
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [build-windows-app, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ServerNeedSafe-Windows-App
          path: release-assets

      - name: Download Linux Server Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ServerNeedSafe-Linux-Server
          path: release-assets

      - name: Generate Final Checksums & Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          (
            cd release-assets
            sha256sum \
              ServerNeedSafe-windows-amd64.exe \
              ServerNeedSafe-windows-arm64.exe \
              ServerNeedSafe-Windows-x64-Portable.zip \
              ServerNeedSafe-Windows-arm64-Portable.zip \
              sns-server-linux-amd64 \
              sns-server-linux-arm64 > SHA256SUMS.txt
          )
          EXISTING_DRAFT=$(gh api "repos/${GH_REPO}/releases?per_page=100" | jq -r --arg tag "${RELEASE_TAG}" '.[] | select(.tag_name == $tag) | .draft' | head -n 1 || true)
          if [ -n "${EXISTING_DRAFT}" ]; then
            gh release upload "${RELEASE_TAG}" release-assets/* -R "${GH_REPO}" --clobber
            if [ "${EXISTING_DRAFT}" = "true" ]; then
              if [[ "${RELEASE_TAG}" == *-* ]]; then
                gh release edit "${RELEASE_TAG}" -R "${GH_REPO}" --draft=false --prerelease
              else
                gh release edit "${RELEASE_TAG}" -R "${GH_REPO}" --draft=false --latest
              fi
            fi
          else
            gh release create "${RELEASE_TAG}" release-assets/* \
              -R "${GH_REPO}" \
              --title "ServerNeedSafe ${RELEASE_TAG}" \
              --generate-notes
          fi
