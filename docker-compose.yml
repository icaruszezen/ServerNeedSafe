services:
  serverneedsafe:
    image: ghcr.io/icaruszezen/serverneedsafe:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: serverneedsafe
    restart: unless-stopped
    ports:
      - "${SNS_BIND_IP:-127.0.0.1}:${SNS_PORT:-18899}:8080"
    environment:
      - TZ=Asia/Shanghai
      - SNS_ADDR=0.0.0.0:8080
      - SNS_DATA_DIR=/data
      - SNS_SESSION_TTL=168h
      # 可选：通过环境变量注入外部静态加密主密钥（≥32 字节），与 /data 目录分离存储。
      # 未设置时首次启动会在 /data/master.key (0600) 自动生成随机 256-bit 主密钥。
      # 建议仅在内网受控主机或启用了 HTTPS/防火墙的安全宿主机上部署。
      # - SNS_MASTER_KEY=${SNS_MASTER_KEY}
    volumes:
      # 持久化分层存储目录：
      # - secrets.enc / master.key : XChaCha20-Poly1305 加密凭据与配置（仅配置变更时写入）
      # - monitor_runtime.json     : 7×24 监控快照、时序历史、告警与基线（独立异步防抖落盘）
      # - aiops_runtime.json       : AI 会话记录、主机记忆、Runbook 与巡检历史
      # - audit_logs.json          : 操作审计日志
      - ./data:/data
    security_opt:
      - no-new-privileges:true
