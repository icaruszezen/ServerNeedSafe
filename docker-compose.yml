services:
  serverneedsafe:
    image: ghcr.io/icaruszezen/serverneedsafe:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: serverneedsafe
    restart: unless-stopped
    ports:
      - "${SNS_BIND_IP:-127.0.0.1}:${SNS_PORT:-18899}:8080"
    environment:
      - TZ=Asia/Shanghai
      - SNS_ADDR=0.0.0.0:8080
      - SNS_DATA_DIR=/data
      - SNS_SESSION_TTL=8h
      # 强烈建议（生产环境）：注入 ≥32 字节的随机高熵外部主密钥，使 /data/.vault.key 与解封密钥分离存放。
      # 生成示例：openssl rand -base64 48 ；请通过 .env / Docker secret 注入，切勿与 /data 一同备份。
      # 未配置时 .vault.key 内含明文封装主密钥（仅依赖 0600 文件权限），/data 整体外泄即等同保险库泄露。
      # - SNS_MASTER_KEY=${SNS_MASTER_KEY:?请设置至少32字节的随机密钥}
    volumes:
      # 持久化存储加密数据包 (vault.sns) 与 7×24 自动挂载封装密钥 (.vault.key)
      # 注意：导出的 .sns 备份仅凭管理员密码加密；但 /data 目录本身含 .vault.key，
      # 未配置 SNS_MASTER_KEY 时获得整个 /data 目录的攻击者可直接解密全部应用数据，请严格保护该目录。
      - ./data:/data
    security_opt:
      - no-new-privileges:true
